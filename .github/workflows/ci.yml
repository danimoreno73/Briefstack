# Every push runs on Linux and Windows (a primary platform). macOS runs too
# once the repository is public, where runner minutes are free, and always
# when started by hand (Actions → CI → Run workflow); while the repository
# is private, macOS minutes cost ten times Linux ones.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # End-to-end tests (Playwright, Chromium) over the fake runners and a local fake GitHub: no network, no login.
      - name: Install Chromium for Playwright
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium for Playwright
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      # The traces of failed end-to-end tests (fake data only), to see where the time went.
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

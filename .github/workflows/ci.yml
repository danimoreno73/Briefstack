# Every push runs on Linux only: macOS and Windows runners use the private
# repo's minutes faster. The full matrix runs only when started by hand
# (Actions → CI → Run workflow). Windows is verified locally.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # End-to-end tests (Playwright, Chromium) over the fake runners and a local fake GitHub: no network, no login.
      - name: Install Chromium for Playwright
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium for Playwright
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
